[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "yixnews"
version = "1.0.0"
description = "Official Python client for the YIX News API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "YIX News" }]
keywords = ["yixnews", "news", "news-api", "uzbekistan"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP"
]

[project.urls]
Homepage = "https://yixnews.vercel.app"
Documentation = "https://yixnews.vercel.app/docs.html"
Repository = "https://github.com/javaoff364-cloud/yix-news-web"
Issues = "https://github.com/javaoff364-cloud/yix-news-web/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/yixnews"]