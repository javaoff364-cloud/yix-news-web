<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YIX News</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #60a5fa;
}

.search {
    margin-top: 15px;
    width: 100%;
    padding: 13px 16px;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 15px;
}

.category {
    border: 0;
    background: white;
    padding: 10px 15px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.category.active {
    background: #111827;
    color: white;
}

.status {
    margin: 10px 0 20px;
    color: #6b7280;
    font-size: 14px;
}

.news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
}

.card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,.07);
    transition: .2s;
}

.card:hover {
    transform: translateY(-3px);
}

.card-image {
    width: 100%;
    height: 190px;
    object-fit: cover;
    background: #e5e7eb;
}

.card-content {
    padding: 17px;
}

.source {
    color: #2563eb;
    font-size: 13px;
    font-weight: bold;
}

.card h2 {
    font-size: 19px;
    line-height: 1.35;
    margin: 8px 0;
}

.summary {
    color: #6b7280;
    line-height: 1.5;
    font-size: 14px;
}

.read {
    display: inline-block;
    margin-top: 12px;
    text-decoration: none;
    background: #111827;
    color: white;
    padding: 9px 13px;
    border-radius: 9px;
    font-size: 14px;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #6b7280;
}

footer {
    margin-top: 50px;
    background: #111827;
    color: #9ca3af;
    text-align: center;
    padding: 25px;
}

@media (max-width: 600px) {
    .logo {
        font-size: 24px;
    }

    .card-image {
        height: 180px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">📰 <span>YIX</span> News</div>

        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔎 Yangilik qidirish..."
        >
    </div>
</header>

<main class="container">

    <div class="categories">
        <button class="category active" data-category="">Barchasi</button>
        <button class="category" data-category="uzbekistan">🇺🇿 O‘zbekiston</button>
        <button class="category" data-category="world">🌍 Dunyo</button>
        <button class="category" data-category="technology">💻 Texnologiya</button>
        <button class="category" data-category="economy">💰 Iqtisodiyot</button>
        <button class="category" data-category="science">🔬 Fan</button>
        <button class="category" data-category="sport">⚽ Sport</button>
        <button class="category" data-category="cinema">🎬 Kino</button>
    </div>

    <div id="status" class="status">
        Yangiliklar yuklanmoqda...
    </div>

    <section id="news" class="news-grid"></section>

</main>

<footer>
    <strong>YIX News</strong><br>
    Yangiliklar bir joyda.
</footer>

<script>

const API = "https://yix-news.onrender.com/api/news";

const newsContainer = document.getElementById("news");
const statusEl = document.getElementById("status");
const searchInput = document.getElementById("search");

let allNews = [];
let currentCategory = "";

async function loadNews(category = "") {

    statusEl.textContent = "⏳ Yangiliklar yuklanmoqda...";
    newsContainer.innerHTML = "";

    try {

        let url = API;

        if (category) {
            url += "?category=" + encodeURIComponent(category);
        }

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("API xatosi");
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error("News API ishlamadi");
        }

        allNews = data.news || [];

        renderNews(allNews);

        statusEl.textContent =
            `📰 ${allNews.length} ta yangilik`;

    } catch (error) {

        console.error(error);

        statusEl.textContent =
            "❌ Yangiliklarni yuklashda xatolik";

        newsContainer.innerHTML = `
            <div class="empty">
                <h2>Yangiliklar yuklanmadi</h2>
                <p>Server bilan aloqa vaqtincha mavjud emas.</p>
            </div>
        `;
    }
}

function renderNews(news) {

    if (!news.length) {

        newsContainer.innerHTML = `
            <div class="empty">
                <h2>😔 Yangilik topilmadi</h2>
                <p>Boshqa kategoriya yoki qidiruv so‘zini sinab ko‘ring.</p>
            </div>
        `;

        return;
    }

    newsContainer.innerHTML = news.map(article => {

        const image = article.image
            ? article.image
            : "https://placehold.co/800x450?text=YIX+News";

        const title = escapeHtml(article.title || "Yangilik");

        const summary = escapeHtml(
            article.summary || "Maqolani o‘qish uchun tugmani bosing."
        );

        const source = escapeHtml(
            article.source || "YIX News"
        );

        return `
            <article class="card">

                <img
                    class="card-image"
                    src="${image}"
                    alt="${title}"
                    loading="lazy"
                    onerror="this.src='https://placehold.co/800x450?text=YIX+News'"
                >

                <div class="card-content">

                    <div class="source">
                        ${source}
                    </div>

                    <h2>
                        ${title}
                    </h2>

                    <div class="summary">
                        ${summary}
                    </div>

                    <a
                        class="read"
                        href="${article.link}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Maqolani o‘qish →
                    </a>

                </div>

            </article>
        `;

    }).join("");
}

function escapeHtml(text) {

    const div = document.createElement("div");
    div.textContent = text;

    return div.innerHTML;
}

document.querySelectorAll(".category").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".category")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        currentCategory = button.dataset.category;

        loadNews(currentCategory);
    });

});

searchInput.addEventListener("input", () => {

    const query =
        searchInput.value.toLowerCase().trim();

    if (!query) {

        renderNews(allNews);

        statusEl.textContent =
            `📰 ${allNews.length} ta yangilik`;

        return;
    }

    const filtered = allNews.filter(article => {

        const text = `
            ${article.title || ""}
            ${article.summary || ""}
            ${article.source || ""}
        `.toLowerCase();

        return text.includes(query);
    });

    renderNews(filtered);

    statusEl.textContent =
        `🔎 ${filtered.length} ta natija`;
});

loadNews();

</script>

</body>
</html>
