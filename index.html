<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YIX News — Yangiliklar</title>

<style>
:root{
 --bg:#f5f7fb;
 --card:#ffffff;
 --text:#111827;
 --muted:#6b7280;
 --border:#e5e7eb;
 --accent:#2563eb;
 --header:rgba(255,255,255,.82);
}

[data-theme="dark"]{
 --bg:#080b12;
 --card:#111722;
 --text:#f3f4f6;
 --muted:#9ca3af;
 --border:#202938;
 --accent:#60a5fa;
 --header:rgba(8,11,18,.84);
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:var(--bg);
 color:var(--text);
 transition:.25s;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 backdrop-filter:blur(18px);
 background:var(--header);
 border-bottom:1px solid var(--border);
}

.nav{
 max-width:1200px;
 margin:auto;
 padding:16px 20px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.logo{
 font-size:25px;
 font-weight:900;
 letter-spacing:-1px;
}

.logo span{color:var(--accent)}

.actions{
 display:flex;
 gap:8px;
}

button,.navlink{
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 border-radius:12px;
 padding:10px 14px;
 cursor:pointer;
 text-decoration:none;
 font-weight:700;
}

.hero{
 max-width:1200px;
 margin:auto;
 padding:55px 20px 25px;
}

.hero h1{
 font-size:clamp(34px,6vw,65px);
 line-height:1;
 margin:0 0 16px;
 letter-spacing:-3px;
}

.hero p{
 color:var(--muted);
 font-size:18px;
 max-width:650px;
}

.preferences{max-width:1200px;margin:auto;padding:0 20px 18px;display:flex;gap:10px;flex-wrap:wrap}
.preferences select{min-width:190px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font:inherit}
.skeleton{background:linear-gradient(90deg,var(--border) 25%,rgba(150,150,150,.18) 50%,var(--border) 75%);background-size:200% 100%;animation:yix-shimmer 1.2s infinite}
@keyframes yix-shimmer{to{background-position:-200% 0}}
.card img{background-color:var(--border);background-image:linear-gradient(90deg,var(--border),rgba(150,150,150,.22),var(--border));background-size:200% 100%;animation:yix-shimmer 1.2s infinite}
.card img.loaded{animation:none;background:var(--border)}
.search{
 max-width:1200px;
 margin:auto;
 padding:0 20px 20px;
}

.search input{
 width:100%;
 padding:17px 20px;
 border-radius:15px;
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 outline:none;
 font-size:16px;
}

.categories{
 max-width:1200px;
 margin:auto;
 padding:5px 20px 25px;
 display:flex;
 gap:8px;
 overflow-x:auto;
}

.categories button.active{
 background:var(--accent);
 color:white;
 border-color:var(--accent);
}

.status{
 max-width:1200px;
 margin:auto;
 padding:0 20px 15px;
 color:var(--muted);
}

.grid{
 max-width:1200px;
 margin:auto;
 padding:0 20px 50px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
 gap:20px;
}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:20px;
 overflow:hidden;
 transition:.2s;
}

.card:hover{
 transform:translateY(-4px);
}

.card img{
 width:100%;
 height:190px;
 object-fit:cover;
 background:#1f2937;
}

.content{
 padding:17px;
}

.source{
 display:inline-block;
 color:var(--accent);
 text-decoration:none;
 font-size:13px;
 font-weight:800;
}

.title{
 font-size:19px;
 line-height:1.3;
 margin:9px 0;
 font-weight:850;
}

.summary{
 color:var(--muted);
 line-height:1.5;
 font-size:14px;
}

 .read{
 display:inline-block;
 margin-top:14px;
 color:var(--accent);
 font-weight:800;
 text-decoration:none;
}

.date{
 color:var(--muted);
 font-size:12px;
 margin-top:6px;
}

#loadMore{
 display:block;
 margin:10px auto 50px;
 padding:14px 24px;
}

footer{
 border-top:1px solid var(--border);
 padding:30px 20px;
 text-align:center;
 color:var(--muted);
}

@media(max-width:600px){
 .nav{padding:13px 15px}
 .hero{padding:40px 15px 20px}
 .search,.categories,.status,.grid{padding-left:15px;padding-right:15px}
 .grid{grid-template-columns:1fr}
 .navlink{display:inline-flex;padding:8px 9px;font-size:12px}
 .actions{gap:5px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">YIX <span>NEWS</span></div>

<div class="actions">
<a class="navlink" href="docs.html">API Docs</a>
<a class="navlink" href="dashboard.html">API</a>
<button id="themeToggle" onclick="toggleTheme()" aria-label="Dark mode">🌙</button>
</div>
</div>
</header>

<section class="hero">
<h1>Yangiliklar.<br><span style="color:var(--accent)">Bir joyda.</span></h1>
<p>
O‘zbekiston va dunyodagi muhim yangiliklarni
tez, qulay va zamonaviy interfeysda kuzating.
</p>
</section>

<div class="preferences">
<select id="countrySelect" aria-label="Davlat"><option value="uzbekistan">🇺🇿 O‘zbekiston</option><option value="usa">🇺🇸 AQSH</option><option value="uk">🇬🇧 Buyuk Britaniya</option><option value="russia">🇷🇺 Rossiya</option><option value="turkey">🇹🇷 Turkiya</option><option value="india">🇮🇳 Hindiston</option><option value="international">🌍 Xalqaro</option></select>
<select id="languageSelect" aria-label="Til"></select>
</div>
<div class="search">
<input id="search" placeholder="🔎 Yangilik qidirish...">
</div>

<div class="categories">
<button class="active" data-cat="">Barchasi</button>
<button data-cat="uzbekistan">🇺🇿 O‘zbekiston</button>
<button data-cat="world">🌍 Dunyo</button>
<button data-cat="technology">💻 Texnologiya</button>
<button data-cat="economy">💰 Iqtisodiyot</button>
<button data-cat="science">🔬 Fan</button>
<button data-cat="sport">⚽ Sport</button>
<button data-cat="cinema">🎬 Kino</button>
</div>

<div class="status" id="status">⏳ Yuklanmoqda...</div>

<main class="grid" id="news"></main>

<button id="loadMore" style="display:none">
 Yana 50 ta
</button>

<footer>
 2026 YIX News · News API Platform
</footer>

<script>
const API="https://yix-news.onrender.com/api/site-news";
const PAGE_SIZE=50;
const CACHE_KEY="yix-news-cache-v2";
const LANGUAGE_OPTIONS={uzbekistan:[["uz","O‘zbekcha"],["ru","Русский"]],usa:[["en","English"]],uk:[["en","English"]],russia:[["ru","Русский"]],turkey:[["tr","Türkçe"],["en","English"]],india:[["en","English"],["hi","हिन्दी"]],international:[["en","English"]]};
let country=localStorage.getItem("yix-country")||"uzbekistan";
let language=localStorage.getItem("yix-language")||"uz";
let category="";
let offset=0;
let articles=[];
let loading=false;

const news=document.getElementById("news");
const status=document.getElementById("status");
const loadMore=document.getElementById("loadMore");
const search=document.getElementById("search");
const countrySelect=document.getElementById("countrySelect");
const languageSelect=document.getElementById("languageSelect");
function updateLanguageOptions(){const options=LANGUAGE_OPTIONS[country]||LANGUAGE_OPTIONS.international;if(!options.some(x=>x[0]===language))language=options[0][0];languageSelect.innerHTML=options.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");languageSelect.value=language;document.documentElement.lang=language;}
countrySelect.value=country;updateLanguageOptions();

function updateThemeButton(){
 const dark=document.documentElement.dataset.theme==="dark";
 const button=document.getElementById("themeToggle");
 if(button){
   button.textContent=dark?"☀️":"🌙";
   button.setAttribute("aria-label",dark?"Light mode":"Dark mode");
 }
}

function toggleTheme(){
 const dark=document.documentElement.dataset.theme==="dark";
 document.documentElement.dataset.theme=dark?"":"dark";
 localStorage.setItem("yix-theme",dark?"light":"dark");
 updateThemeButton();
}

if(localStorage.getItem("yix-theme")==="dark"){
 document.documentElement.dataset.theme="dark";
}
updateThemeButton();

function safeUrl(value){
 try{const u=new URL(value);return ["http:","https:"].includes(u.protocol)?u.href:"";}catch{return "";}
}

function formatDate(value){
 if(!value)return "";
 const date=new Date(value);
 if(Number.isNaN(date.getTime()))return "";
 return new Intl.DateTimeFormat(language==="ru"?"ru-RU":language==="en"?"en-US":language==="tr"?"tr-TR":language==="hi"?"hi-IN":"uz-UZ",{dateStyle:"medium",timeStyle:"short"}).format(date);
}

function render(){
 const q=search.value.toLowerCase().trim();

 const filtered=articles.filter(a=>{
   const text=(
     (a.title||"")+" "+
     (a.summary||"")+" "+
     (a.source||"")
   ).toLowerCase();

   return text.includes(q);
 });

 news.innerHTML=filtered.map(a=>{ const href=safeUrl(a.link||a.url); const image=safeUrl(a.image); const date=formatDate(a.published_at); return `
 <article class="card">
   <img
    class="article-image"
    src="${image || 'https://placehold.co/800x500?text=YIX+NEWS'}"
    onload="this.classList.add('loaded')"
    onerror="this.src='https://placehold.co/800x500?text=YIX+NEWS';this.classList.add('loaded')"
   >
   <div class="content">
     ${href ? `<a class="source" href="${href}" target="_blank" rel="noopener noreferrer">${escapeHtml(a.source || "YIX News")} ↗</a>` : `<div class="source">${escapeHtml(a.source || "YIX News")}</div>`}
     ${date ? `<div class="date">${escapeHtml(date)}</div>` : ""}
     <div class="title">${escapeHtml(a.title || "")}</div>
     <div class="summary">${escapeHtml(a.summary || "")}</div>
     ${href ? `<a class="read" href="${href}" target="_blank" rel="noopener noreferrer">Maqolani o‘qish →</a>` : ""}
   </div>
 </article>
 `}).join("");

 status.textContent=`📰 ${filtered.length} ta ko‘rsatilmoqda · ${country} · ${language.toUpperCase()}`;
}

function escapeHtml(text){
 const div=document.createElement("div");
 div.textContent=text;
 return div.innerHTML;
}

async function load(reset=true){

 if(loading)return;

 loading=true;

 if(reset){
   offset=0;
   articles=[];
   news.innerHTML=Array.from({length:6},()=>`<article class="card"><div class="skeleton" style="height:190px"></div><div class="content"><div class="skeleton" style="height:13px;width:45%;margin:12px 0"></div><div class="skeleton" style="height:18px;margin:12px 0"></div><div class="skeleton" style="height:13px;margin:12px 0"></div></div></article>`).join("");
 }

 status.textContent="⏳ Yangiliklar yuklanmoqda...";

 try{

   let url=
    `${API}?limit=${PAGE_SIZE}&offset=${offset}&country=${encodeURIComponent(country)}&language=${encodeURIComponent(language)}`;

   if(category){
     url+=`&category=${encodeURIComponent(category)}`;
   }

   const res=await fetch(url, {cache:"no-store"});
   if(!res.ok) throw new Error(`HTTP ${res.status}`);
   const data=await res.json();

   if(!data.success)throw new Error(data.error || "API error");

   const incoming=data.news||[];

   articles.push(...incoming);
   offset+=incoming.length;
   localStorage.setItem(CACHE_KEY,JSON.stringify({country,language,articles:articles.slice(0,100)}));

   render();

   loadMore.style.display=
      incoming.length===PAGE_SIZE
      ? "block"
      : "none";

 }catch(e){

   let cached=null;
   try{cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");}catch{}
   if(reset && cached && Array.isArray(cached.articles) && cached.articles.length){articles=cached.articles;render();status.textContent="📴 Internet yo‘q. Oxirgi saqlangan yangiliklar ko‘rsatilmoqda.";}else{status.textContent="📴 Internet yo‘q. Skeleton loading davom etmoqda; ulanish tiklanganda qayta yuklanadi.";}

 }finally{
   loading=false;
 }
}

document.querySelectorAll(".categories button")
.forEach(btn=>{
 btn.onclick=()=>{
   document.querySelectorAll(".categories button")
    .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   category=btn.dataset.cat;

   load(true);
 };
});

search.oninput=render;
countrySelect.onchange=()=>{country=countrySelect.value;language=LANGUAGE_OPTIONS[country][0][0];updateLanguageOptions();localStorage.setItem("yix-country",country);localStorage.setItem("yix-language",language);load(true);};
languageSelect.onchange=()=>{language=languageSelect.value;localStorage.setItem("yix-language",language);load(true);};
window.addEventListener("online",()=>load(true));
window.addEventListener("offline",()=>{if(!articles.length)status.textContent="📴 Internet yo‘q. Skeleton loading...";});
loadMore.onclick=()=>load(false);
load(true);
</script>

</body>
</html>
