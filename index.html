<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YIX News — Yangiliklar</title>

<style>
:root{
 --bg:#f5f7fb;
 --card:#ffffff;
 --text:#111827;
 --muted:#6b7280;
 --border:#e5e7eb;
 --accent:#2563eb;
 --header:rgba(255,255,255,.82);
}

[data-theme="dark"]{
 --bg:#080b12;
 --card:#111722;
 --text:#f3f4f6;
 --muted:#9ca3af;
 --border:#202938;
 --accent:#60a5fa;
 --header:rgba(8,11,18,.84);
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:var(--bg);
 color:var(--text);
 transition:.25s;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 backdrop-filter:blur(18px);
 background:var(--header);
 border-bottom:1px solid var(--border);
}

.nav{
 max-width:1200px;
 margin:auto;
 padding:16px 20px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.logo{
 font-size:25px;
 font-weight:900;
 letter-spacing:-1px;
}

.logo span{color:var(--accent)}

.actions{
 display:flex;
 gap:8px;
}

button,.navlink{
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 border-radius:12px;
 padding:10px 14px;
 cursor:pointer;
 text-decoration:none;
 font-weight:700;
}

.hero{
 max-width:1200px;
 margin:auto;
 padding:55px 20px 25px;
}

.hero h1{
 font-size:clamp(34px,6vw,65px);
 line-height:1;
 margin:0 0 16px;
 letter-spacing:-3px;
}

.hero p{
 color:var(--muted);
 font-size:18px;
 max-width:650px;
}

.search{
 max-width:1200px;
 margin:auto;
 padding:0 20px 20px;
}

.search input{
 width:100%;
 padding:17px 20px;
 border-radius:15px;
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 outline:none;
 font-size:16px;
}

.categories{
 max-width:1200px;
 margin:auto;
 padding:5px 20px 25px;
 display:flex;
 gap:8px;
 overflow-x:auto;
}

.categories button.active{
 background:var(--accent);
 color:white;
 border-color:var(--accent);
}

.status{
 max-width:1200px;
 margin:auto;
 padding:0 20px 15px;
 color:var(--muted);
}

.grid{
 max-width:1200px;
 margin:auto;
 padding:0 20px 50px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
 gap:20px;
}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:20px;
 overflow:hidden;
 transition:.2s;
}

.card:hover{
 transform:translateY(-4px);
}

.card img{
 width:100%;
 height:190px;
 object-fit:cover;
 background:#1f2937;
}

.content{
 padding:17px;
}

.source{
 color:var(--accent);
 font-size:13px;
 font-weight:800;
}

.title{
 font-size:19px;
 line-height:1.3;
 margin:9px 0;
 font-weight:850;
}

.summary{
 color:var(--muted);
 line-height:1.5;
 font-size:14px;
}

.read{
 display:inline-block;
 margin-top:14px;
 color:var(--accent);
 font-weight:800;
 text-decoration:none;
}

#loadMore{
 display:block;
 margin:10px auto 50px;
 padding:14px 24px;
}

footer{
 border-top:1px solid var(--border);
 padding:30px 20px;
 text-align:center;
 color:var(--muted);
}

@media(max-width:600px){
 .nav{padding:13px 15px}
 .hero{padding:40px 15px 20px}
 .search,.categories,.status,.grid{padding-left:15px;padding-right:15px}
 .grid{grid-template-columns:1fr}
 .navlink{display:none}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">YIX <span>NEWS</span></div>

<div class="actions">
<a class="navlink" href="docs.html">API Docs</a>
<a class="navlink" href="dashboard.html">API</a>
<button onclick="toggleTheme()">🌙</button>
</div>
</div>
</header>

<section class="hero">
<h1>Yangiliklar.<br><span style="color:var(--accent)">Bir joyda.</span></h1>
<p>
O‘zbekiston va dunyodagi muhim yangiliklarni
tez, qulay va zamonaviy interfeysda kuzating.
</p>
</section>

<div class="search">
<input id="search" placeholder="🔎 Yangilik qidirish...">
</div>

<div class="categories">
<button class="active" data-cat="">Barchasi</button>
<button data-cat="uzbekistan">🇺🇿 O‘zbekiston</button>
<button data-cat="world">🌍 Dunyo</button>
<button data-cat="technology">💻 Texnologiya</button>
<button data-cat="economy">💰 Iqtisodiyot</button>
<button data-cat="science">🔬 Fan</button>
<button data-cat="sport">⚽ Sport</button>
<button data-cat="cinema">🎬 Kino</button>
</div>

<div class="status" id="status">⏳ Yuklanmoqda...</div>

<main class="grid" id="news"></main>

<button id="loadMore" style="display:none">
 Yana 50 ta
</button>

<footer>
 2026 YIX News · News API Platform
</footer>

<script>
const API="https://yix-news.onrender.com/api/site-news";
const PAGE_SIZE=50;

let category="";
let offset=0;
let articles=[];
let loading=false;

const news=document.getElementById("news");
const status=document.getElementById("status");
const loadMore=document.getElementById("loadMore");
const search=document.getElementById("search");

function toggleTheme(){
 const dark=document.documentElement.dataset.theme==="dark";

 document.documentElement.dataset.theme=dark?"":"dark";

 localStorage.setItem(
   "yix-theme",
   dark?"light":"dark"
 );
}

if(localStorage.getItem("yix-theme")==="dark"){
 document.documentElement.dataset.theme="dark";
}

function render(){
 const q=search.value.toLowerCase().trim();

 const filtered=articles.filter(a=>{
   const text=(
     (a.title||"")+" "+
     (a.summary||"")+" "+
     (a.source||"")
   ).toLowerCase();

   return text.includes(q);
 });

 news.innerHTML=filtered.map(a=>`
 <article class="card">
   <img
    src="${a.image || 'https://placehold.co/800x500?text=YIX+NEWS'}"
    onerror="this.src='https://placehold.co/800x500?text=YIX+NEWS'"
   >
   <div class="content">
     <div class="source">${a.source || "YIX News"}</div>
     <div class="title">${escapeHtml(a.title || "")}</div>
     <div class="summary">${escapeHtml(a.summary || "")}</div>
     ${a.url ? `<a class="read" href="${a.url}" target="_blank" rel="noopener">Maqolani o‘qish →</a>` : ""}
   </div>
 </article>
 `).join("");

 status.textContent=`📰 ${filtered.length} ta ko‘rsatilmoqda · Jami yuklangan: ${articles.length}`;
}

function escapeHtml(text){
 const div=document.createElement("div");
 div.textContent=text;
 return div.innerHTML;
}

async function load(reset=true){

 if(loading)return;

 loading=true;

 if(reset){
   offset=0;
   articles=[];
   news.innerHTML="";
 }

 status.textContent="⏳ Yangiliklar yuklanmoqda...";

 try{

   let url=
    `${API}?limit=${PAGE_SIZE}&offset=${offset}`;

   if(category){
     url+=`&category=${encodeURIComponent(category)}`;
   }

   const res=await fetch(url);
   const data=await res.json();

   if(!data.success)throw new Error();

   const incoming=data.news||[];

   articles.push(...incoming);
   offset+=incoming.length;

   render();

   loadMore.style.display=
      incoming.length===PAGE_SIZE
      ? "block"
      : "none";

 }catch(e){

   status.textContent="❌ Yangiliklarni yuklab bo‘lmadi";

 }finally{
   loading=false;
 }
}

document.querySelectorAll(".categories button")
.forEach(btn=>{
 btn.onclick=()=>{
   document.querySelectorAll(".categories button")
    .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   category=btn.dataset.cat;

   load(true);
 };
});

search.oninput=render;

loadMore.onclick=()=>load(false);

load(true);
</script>

</body>
</html>
