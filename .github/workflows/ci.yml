name: YIX News web checks

on:
  push:
    branches: [master, "update/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          for page in ("index.html", "dashboard.html", "docs.html"):
              source = pathlib.Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script\\s*>", source, re.I)
              for number, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile(
                      mode="w", suffix=".js", encoding="utf-8", delete=False
                  ) as output:
                      output.write(script)
                      filename = output.name
                  subprocess.run(["node", "--check", filename], check=True)
              print(f"Syntax OK: {page}")
          PY
